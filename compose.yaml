name: dampp

# Verze, porty a WEB_ROOT predava dampp.py pres promenne prostredi (nastaveni: klavesa n).
services:
  mariadb:
    image: mariadb:${MARIADB_TAG:-latest}
    ports:
      - "127.0.0.1:${MARIADB_PORT:-3306}:3306"
    environment:
      MARIADB_ROOT_PASSWORD: "${MARIADB_ROOT_PASSWORD:-root}"
    volumes:
      - mariadb-data:/var/lib/mysql

  nginx:
    image: nginx:${NGINX_TAG:-latest}
    ports:
      - "127.0.0.1:${NGINX_PORT:-80}:80"
    environment:
      # entrypoint naplni NGINX_LOCAL_RESOLVERS, sablona ho pouzije v `resolver`
      NGINX_ENTRYPOINT_LOCAL_RESOLVERS: "1"
    volumes:
      - "${WEB_ROOT:-./www}:/var/www/html"
      - "./nginx.conf.template:/etc/nginx/templates/default.conf.template:ro"

  php:
    image: php:${PHP_TAG:-fpm}
    environment:
      # pro landing page (www/index.php): test pripojeni k DB a odkaz na phpMyAdmin
      MARIADB_ROOT_PASSWORD: "${MARIADB_ROOT_PASSWORD:-root}"
      MARIADB_PORT: "${MARIADB_PORT:-3306}"
      PMA_PORT: "${PMA_PORT:-8080}"
    volumes:
      - "${WEB_ROOT:-./www}:/var/www/html"
    # oficialni image nema mysqli/pdo_mysql - doinstaluji se pri prvnim startu kontejneru
    command:
      - sh
      - -c
      - "php -m | grep -qi mysqli || docker-php-ext-install mysqli pdo_mysql; exec php-fpm"

  phpmyadmin:
    image: phpmyadmin:${PMA_TAG:-latest}
    ports:
      - "127.0.0.1:${PMA_PORT:-8080}:80"
    environment:
      PMA_HOST: mariadb

volumes:
  mariadb-data: {}
