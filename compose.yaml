name: dampp

# Versions, ports and WEB_ROOT are passed by dampp.py through environment variables (settings: key n).
services:
  mariadb:
    image: mariadb:${MARIADB_TAG:-latest}
    ports:
      - "127.0.0.1:${MARIADB_PORT:-3306}:3306"
    environment:
      MARIADB_ROOT_PASSWORD: "${MARIADB_ROOT_PASSWORD:-root}"
    volumes:
      - mariadb-data:/var/lib/mysql

  nginx:
    image: nginx:${NGINX_TAG:-latest}
    ports:
      - "127.0.0.1:${NGINX_PORT:-80}:80"
    environment:
      # the entrypoint fills NGINX_LOCAL_RESOLVERS, the template uses it in `resolver`
      NGINX_ENTRYPOINT_LOCAL_RESOLVERS: "1"
    volumes:
      - "${WEB_ROOT:-./www}:/var/www/html"
      - "./nginx.conf.template:/etc/nginx/templates/default.conf.template:ro"

  php:
    image: php:${PHP_TAG:-fpm}
    environment:
      # for the landing page (www/index.php): database check and the phpMyAdmin link
      MARIADB_ROOT_PASSWORD: "${MARIADB_ROOT_PASSWORD:-root}"
      MARIADB_PORT: "${MARIADB_PORT:-3306}"
      PMA_PORT: "${PMA_PORT:-8080}"
    volumes:
      - "${WEB_ROOT:-./www}:/var/www/html"
    # the official image lacks mysqli/pdo_mysql - they are installed on the container's first start
    command:
      - sh
      - -c
      - "php -m | grep -qi mysqli || docker-php-ext-install mysqli pdo_mysql; exec php-fpm"

  phpmyadmin:
    image: phpmyadmin:${PMA_TAG:-latest}
    ports:
      - "127.0.0.1:${PMA_PORT:-8080}:80"
    environment:
      PMA_HOST: mariadb

volumes:
  mariadb-data: {}
